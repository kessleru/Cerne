<!doctype html>
<html lang="pt-BR" data-theme="mocha">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- CSP restrita: a rede só vai ao GitHub (API e raw). 'wasm-unsafe-eval' não é necessário (Shiki usa o motor JS). -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://raw.githubusercontent.com; connect-src 'self' https://api.github.com https://raw.githubusercontent.com; worker-src 'self' blob:; font-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'none'"
    />
    <title>Cerne</title>
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%icone-192.svg" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <meta name="theme-color" content="#1e1e2e" />
    <!-- restaura a rota enviada por public/404.html (GitHub Pages); precisa rodar antes do app -->
    <script src="%BASE_URL%restaurar-rota.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
